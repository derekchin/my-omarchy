# Not loaded on Omarchy 4.
#
# Hyprland on this install reads ~/.config/hypr/hyprland.lua, which loads
# hypr/bindings.lua. This file is the earlier ~/.config/hypr/bindings.conf.
# It mapped app launchers to Ctrl and Ctrl+Shift so the Command-position
# thumb key could open them. Those chords are not in the live session.
# The app list is personal (mail, chat, calendar). Drop this file before
# publishing if you do not want that list public.

# Application bindings
bindd = CTRL ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = CTRL, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = CTRL SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = CTRL SHIFT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = CTRL SHIFT, B, Browser, exec, $browser
bindd = CTRL SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = CTRL SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = CTRL SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = CTRL SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = CTRL SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = CTRL SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = CTRL SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = CTRL SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm-app -- obsidian"
bindd = CTRL SHIFT, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = CTRL SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = CTRL SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = CTRL SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = CTRL SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = CTRL SHIFT, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = CTRL SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = CTRL SHIFT SUPER, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = CTRL SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = CTRL SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
unbind = CTRL, Slash
# unbind = CTRL, slash
bindd = CTRL, Slash, Omarchy menu, exec, omarchy-menu
unbind = CTRL SHIFT, M
unbind = CTRL SHIFT, slash
