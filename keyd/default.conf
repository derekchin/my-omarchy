[ids]
*

[main]
# Cmd keys trigger the cmd layer
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# Caps Lock acts as Cmd
capslock = leftmeta

[cmd:C]
# Explicit macros (keyd 2.6 rejects bare C-a form as invalid)
a = macro(C-a)
c = macro(C-c)
v = macro(C-v)
x = macro(C-x)
z = macro(C-z)
s = macro(C-s)
f = macro(C-f)
w = macro(C-w)
t = macro(C-t)
q = macro(C-q)
left = macro(C-a)
right = macro(C-e)

[cmd]
left = home
right = end
leftshift+left = S-home
leftshift+right = S-end

# Ctrl+Alt+Shift -> Super. Also match AltGr in case the Corne sends rightalt.
# Hyprland also binds CTRL+ALT+SHIFT directly as a fallback.
[control+shift+alt]
a = macro(leftmeta+a)
b = macro(leftmeta+b)
